    <style>
        .ascii {
            font-family: "Courier New", monospace;
            font-size: 8px;
            font-weight: bold;
            fill: #444;
        }

        .row {
            opacity: 0;
            animation: reveal 0.7s ease-out forwards;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateX(-8px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
    
