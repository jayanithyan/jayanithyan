<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510">

<style>
.ascii {
    font-family: "Courier New", monospace;
    font-size: 8px;
    font-weight: bold;
    fill: #444;
}

.row {
    animation: reveal 0.8s ease-out forwards;
    opacity: 0;
}

@keyframes reveal {
    from {
        opacity: 0;
        transform: translateX(-8px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}
</style>

